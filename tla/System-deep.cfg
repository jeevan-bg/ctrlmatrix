\* Deeper-bound TLC variant of System.cfg (MaxVecLen=2, MaxEvents=4,
\* MaxCaps=2) per V1.9-PLAN §  line 289-293. Exercised exclusively
\* by the .github/workflows/ci.yml `tlc-deep` job on the nightly cron
\* schedule (06:00 UTC) — NOT exercised on PR or push. The 4× state-
