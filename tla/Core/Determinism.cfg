\* CTRLMATRIX L0 / M3 -- TLC model config for Determinism.tla v0.2
\*
\* Mirrors Events.cfg exactly: same model values, same MaxEvents.
\* Differences vs M1:
\*   - SPECIFICATION = Spec_M3 (not Spec).
\*   - INVARIANT CapturedInvariant added.
\*
\*   - Adds KernelAuthoredEventIds CONSTANT binding (= EventId = {1, 2}
\*     since MaxEvents = 2). Choosing the maximal SUBSET EventId
\*     exercises KernelAuthoredParentsInTrace non-vacuously: every event
\*     must have all parents in trace AND in KernelAuthoredEventIds.
\*     M1's TypeOK structural invariant already constrains parents
\*     \subseteq 1..(i-1), so the in-trace half is structurally
\*     satisfied; the KernelAuthoredEventIds-membership half is
\*     satisfied because every EventId is in KernelAuthoredEventIds.
\*   - Adds INVARIANT KernelAuthoredParentsInTrace.
\*
\* CONSTANT from `KernelAuthored` to `KernelAuthoredEventIds` to
\* disambiguate from Events.tla's `KernelAuthored(e)` Bool 
\* (which gets EXTENDed in by Determinism.tla). The SANY parse-error
\* on `KernelAuthored = {1,2}` (set vs  collision) was the
\* C-D9h-2 / C-D9h-3 finding; the rename closes it.

SPECIFICATION Spec_M3

CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT LatticeSanity
INVARIANT ChainLinkSanity
INVARIANT ObservabilitySanity
INVARIANT CapturedInvariant
INVARIANT KernelAuthoredParentsInTrace

CONSTANTS
    ConfTags       = {c1}
    IntegTags      = {i1}
    ProvTags       = {p1}
    Cap            = {cap1}
    Payload        = {pay1}
    DetWitness     = {w1}
    NoWitness      = NoWitness
    \* line 184 TLC budget guard. Default-`NoTenantId` discipline at
    \* the Events.tla `Next` constructor; Determinism.tla's
    \* `WellWitnessedAppend` does not bind `tenant` explicitly
    \* (preserved verbatim from v1.4-stable; partial-record carry-over
    \* documented in agent-H-report Section "carry-forwards").
    TenantId       = {T1, T2}
    NoTenantId     = NoTenantId
    MaxEvents      = 2
    KernelAuthoredEventIds = {1, 2}
