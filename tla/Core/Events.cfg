\* CTRLMATRIX L0 / M1 -- TLC model config for Events.tla v0.2
\*
\* Tiny constants for fast smoke test. Hash and NoHash are now defined
\* in the spec (Hash = 1..MaxEvents, NoHash = 0), so they no longer
\* appear here.
\*
\* Identifiers c1, i1, p1, cap1, pay1, w1, NoWitness are TLC model
\* values -- distinct opaque symbols. NoWitness \notin DetWitness holds
\* by model-value distinctness.

SPECIFICATION Spec

\* Bounded model: trace caps at MaxEvents, after which no action is
\* enabled. That is "deadlock" in TLA+ terms but not a spec bug.
CHECK_DEADLOCK FALSE

INVARIANT TypeOK
INVARIANT LatticeSanity
INVARIANT ChainLinkSanity

CONSTANTS
    ConfTags   = {c1}
    IntegTags  = {i1}
    ProvTags   = {p1}
    Cap        = {cap1}
    Payload    = {pay1}
    DetWitness = {w1}
    NoWitness  = NoWitness
    \* Cardinality 2 (T1, T2) plus NoTenantId sentinel (cardinality 3
    \* TLC budget guard. Default-`NoTenantId` discipline at the `Next`
    \* constructor (Events.tla L431) keeps the v0.1-cfg state-space
    \* behaviour unchanged at MaxEvents=2.
    TenantId   = {T1, T2}
    NoTenantId = NoTenantId
    MaxEvents  = 2
INVARIANT ObservabilitySanity
