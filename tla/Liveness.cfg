\* CTRLMATRIX T9 family v0.1 -- TLC config for Liveness.tla
\*
\*
\* Bounded model (chosen for TLC tractability at v0.1):
\*   - MaxNow = 3: clock window covering Delta_ext = 2, Delta_rev = 3,
\*     Delta_cmp = 2 against Partition_P = 1. At this scope the
\*     state space is fully explored in ~30s wall-clock with
\*     76,242 states / 17,647 distinct states / depth 8.
\*   - MaxPending = 1: forces serial pending requests; exercises the
\*     core Delta_*-deadline reachability in the bounded model.
\*   - Partition_P = 1: minimal non-trivial partition window;
\*
\* MaxNow = 4 is feasible but exceeds the 60s wall-time budget at
\* Increasing MaxPending exponentially blows up state space; v0.1
\* ships with serial pending requests; concurrent pending coverage
\* lands with TLAPS mechanization at P6.

SPECIFICATION Spec_Liveness

CONSTANTS
    Delta_ext    = 2
    Delta_rev    = 3
    Delta_cmp    = 2
    MaxNow       = 3
    MaxPending   = 1
    Partition_P  = 1

INVARIANT
    TypeOK
    Inv_BoundedExt
    Inv_BoundedRev
    Inv_BoundedCmp
    Inv_PartitionBudget

PROPERTY
    L_Ext_Bound
    L_Rev_Bound
    L_Cmp_Bound

CHECK_DEADLOCK FALSE
