SPECIFICATION Spec_M8

\* per bootstrap brief's TLC growth-budget guidance. Original Bytes/Hash
\* cardinalities (2 each) blow the state space past 10x budget when
\* combined with the new VARIABLES (lastPublishedRoot, lastEntryAtomic)
\* and new M6 chain-extending actions (SystemPublishAndAudit,
\* SystemPublishAndAuditWithCapMatch). Reductions are documented in
\* System.tla's Default*Min  block.
CONSTANTS
    Kind             <- DefaultKindMin
    DetKinds         <- DefaultDetKindsMin
    NonDetKinds      <- DefaultNonDetKindsMin
    ObservableKinds  <- DefaultObservableKindsMin
    DeclassifyKind   <- DefaultDeclassifyKind
    DetWitness       <- DefaultDetWitness
    NoWitness        <- DefaultNoWitness
    Payload          <- DefaultPayload
    Sigma_C          <- DefaultSigma_C
    Sigma_I          <- DefaultSigma_I
    Sigma_P          <- DefaultSigma_P
    Transformers     <- DefaultTransformersMin
    TransformerFn    <- DefaultTransformerFnMin
    AuthRel          <- DefaultAuthRelMin
    CapId            <- DefaultCapIdMin
    NoCap            <- DefaultNoCap
    AttenuatesRel    <- DefaultAttenuatesRelMin
    Bytes            <- DefaultBytesMin
    Hash             <- DefaultHashMin
    SystemGenesis    <- DefaultSystemGenesisMin
    H_op             <- DefaultH_opMin
    SerializeFn      <- DefaultSerializeFnMin
    Values           <- DefaultValues
    StoreRoot        <- DefaultStoreRootSys
    CapRoots         <- DefaultCapRootsMin
    DetWitnessHashes <- DefaultDetWitnessHashesSys
    NoWitnessRef     <- DefaultNoWitnessRefSys
    MaxVecLen        = 1
    MaxEvents        = 2
    MaxCaps          = 1
    \* 2 (T1, T2) plus NoTenantId sentinel (cardinality 3 total over
    \* `TenantId \cup {NoTenantId}`). Default-`NoTenantId` discipline at
    \* the EmitNonDeclass / EmitDeclass constructors keeps the v0.1-cfg
    \* state-space behaviour unchanged at MaxEvents=2.
    TenantId         = {T1, T2}
    NoTenantId       = NoTenantId

INVARIANTS
    M8_FullInv

CHECK_DEADLOCK
    FALSE
